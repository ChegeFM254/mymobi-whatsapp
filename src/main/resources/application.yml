server:
  port: ${PORT:3000}

whatsapp:
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:mymobi_test_123}
  app-secret: ${WHATSAPP_APP_SECRET:}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
  public-base-url: ${PUBLIC_BASE_URL:}

app:
  allow-login-without-stored-data: ${ALLOW_LOGIN_WITHOUT_STORED_DATA:true}
  login-lockout-duration-seconds: ${LOGIN_LOCKOUT_DURATION_SECONDS:0}

logging:
  level:
    root: INFO
    com.mfstechnologies.mymobi: INFO

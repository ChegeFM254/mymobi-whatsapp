name: Build & Test

# Runs automatically on every push and every pull request, so a broken
# file is caught immediately (as a red X right on the commit) instead of
# only being discovered later during a manual Render deploy.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21 (matches the Dockerfile)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: mvn clean package
